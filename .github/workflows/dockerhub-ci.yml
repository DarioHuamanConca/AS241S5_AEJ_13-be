name: CI/CD DockerHub Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: dariohuamanconca
          password: ${{ secrets.DOCKERHUB_TOKEN_DARIO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            dariohuamanconca/as241s5_aej_13-be:latest
            dariohuamanconca/as241s5_aej_13-be:${{ github.sha }}
